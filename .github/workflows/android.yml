name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Prepare Android Project Structure & Build
      run: |
        # 1. Instalar Gradle en el Runner de GitHub
        sudo apt-get update && sudo apt-get install -y gradle
        
        # 2. Reestructurar carpetas al estándar de Android
        mkdir -p app/src/main/java/com/example/screenmirror
        
        # Mover los archivos a su sitio correspondiente
        mv AndroidManifest.xml app/src/main/ 2>/dev/null || true
        mv *.kt app/src/main/java/com/example/screenmirror/ 2>/dev/null || true
        
        # Ajustar los package de los archivos Kotlin para evitar errores de compilación
        sed -i '1s/^/package com.example.screenmirror\n\n/' app/src/main/java/com/example/screenmirror/*.kt 2>/dev/null || true
        
        # 3. Crear el build.gradle de la raíz
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.1'
                classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        # 4. Crear el build.gradle del módulo app
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }

        android {
            namespace 'com.example.screenmirror'
            compileSdk 33

            defaultConfig {
                applicationId "com.example.screenmirror"
                minSdk 24
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.10.1'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.9.0'
            implementation 'org.nanohttpd:nanohttpd:2.3.1'
        }
        EOF

        # 5. Crear settings.gradle actualizado
        cat << 'EOF' > settings.gradle
        include ':app'
        rootProject.name = "ScreenMirror"
        EOF

        # 6. Generar el wrapper e iniciar compilación limpia
        gradle wrapper
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk
